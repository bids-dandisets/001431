description: 'More details will be provided upon publication. The dataset contains
  spike timestamps (bin number) relative to stimulus onset with 0.5ms bin size. 4
  types of visual stimuli were displayed with 30+ trials each day for 15 days. Which
  neuron, which day, which condition and which trial information for each timestamp
  cell was explained in a separate table.  Whether a neuron appeared on a specific
  day, units that appeared for many days ("high attendance" units), whether the tuning
  to specific stimuli was significant on a given day (for high attendance units only)
  as well as whether a neuron was among least 15% poorly tuned neurons were also provided
  as separate tables. '
